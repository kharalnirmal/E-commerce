name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chauk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chauk_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/chauk_test
      BETTER_AUTH_SECRET: test-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEMO_PASSWORD: demo-password-for-ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:db:prepare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run build
      - run: npm run test:e2e
